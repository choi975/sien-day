<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>生理期倒计时</title>
    <link rel="icon" href="icons/calendar-days.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <!--
      THESIS: Answer one question at a glance: how many days remain; refuse dashboard density and decorative wellness chrome.
      OWN-WORLD: Cool white surfaces, graphite type and controls, one berry countdown accent, thin neutral rules, restrained 6-10px control radii.
      STORY: See the remaining days, confirm the predicted date, update the underlying dates only when needed, and always understand cloud/read-only state.
      FIRST VIEWPORT: A quiet full-height page with a compact header, centered “还有 12 天”, predicted date, one update action, and a single-line sync footer.
      FORM: User-approved Baoyu Design v2, pinned-user-direction-20260824.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <main class="simple-app" id="countdownCard" aria-label="生理期倒计时" aria-busy="true">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <span class="icon" style="--icon-src: url('icons/calendar-days.svg')"></span>
          </span>
          <span>生理期倒计时</span>
        </div>
        <button
          class="icon-button"
          type="button"
          title="更新生理期日期"
          aria-label="更新生理期日期"
          aria-describedby="statusText"
          data-open-editor
          disabled
        >
          <span class="icon" style="--icon-src: url('icons/calendar-cog.svg')" aria-hidden="true"></span>
        </button>
      </header>

      <section class="simple-main" aria-label="下一次生理期预测">
        <div class="offline-message" id="offlineMessage" role="status" hidden>
          <span id="offlineMessageText">云端暂不可用</span>
          <button id="retryConnection" type="button">重试</button>
        </div>

        <div class="countdown-panel">
          <h1 class="simple-label">距离下一次生理期</h1>
          <div class="simple-readout" aria-live="polite">
            <span id="countdownPrefix">还有</span>
            <strong id="daysLeft">--</strong>
            <span>天</span>
          </div>
          <p class="simple-date" id="nextDate">正在读取日期</p>
          <p class="sr-only" id="predictionText">正在读取云端日期记录</p>
          <button class="primary-button update-button" type="button" data-open-editor disabled>
            <span class="icon" style="--icon-src: url('icons/calendar-cog.svg')" aria-hidden="true"></span>
            更新日期
          </button>
        </div>
      </section>

      <footer class="sync-footer" id="status" role="status" aria-live="polite">
        <span class="sync-dot" aria-hidden="true"></span>
        <span id="statusText">正在连接云端</span>
      </footer>
    </main>

    <dialog id="editor" aria-labelledby="editorTitle" tabindex="-1">
      <form class="editor-sheet" id="editorForm" method="dialog" novalidate>
        <header class="sheet-header">
          <h2 id="editorTitle">更新生理期日期</h2>
          <button class="icon-button" id="closeEditor" type="button" title="关闭" aria-label="关闭">
            <span class="icon" style="--icon-src: url('icons/x.svg')" aria-hidden="true"></span>
          </button>
        </header>

        <div class="sheet-body">
          <div class="list-heading">
            <span>已确认日期</span>
            <button class="add-button" id="addDate" type="button">
              <span class="icon" style="--icon-src: url('icons/plus.svg')" aria-hidden="true"></span>
              添加
            </button>
          </div>

          <div class="confirmed-list" id="dateList"></div>

          <button class="today-button" id="recordToday" type="button" hidden>
            <span>今天已经开始？</span>
            <strong>记为今天</strong>
          </button>

          <button class="prediction-disclosure" id="togglePredictions" type="button" aria-expanded="false">
            <span>未来预测</span>
            <span class="disclosure-right">
              <span id="predictionCount">12 条</span>
              <span class="icon" style="--icon-src: url('icons/chevron-down.svg')" aria-hidden="true"></span>
            </span>
          </button>
          <div class="prediction-list" id="predictionList" hidden></div>

          <div class="password-section">
            <label for="editPassword">编辑密码</label>
            <div class="password-wrap">
              <span class="icon" style="--icon-src: url('icons/lock-keyhole.svg')" aria-hidden="true"></span>
              <input
                id="editPassword"
                type="password"
                autocomplete="current-password"
                required
                aria-describedby="editorError"
              />
            </div>
            <p class="field-error" id="editorError" role="alert" aria-live="assertive"></p>
          </div>
        </div>

        <footer class="sheet-footer">
          <button class="secondary-button" id="cancelEdit" type="button">取消</button>
          <button class="primary-button" id="saveDates" type="submit">
            <span class="icon" id="saveIcon" style="--icon-src: url('icons/check.svg')" aria-hidden="true"></span>
            <span id="saveLabel">保存</span>
          </button>
        </footer>
      </form>
    </dialog>

    <script>
      const WORKER_API_BASE_URL = "https://sien-day.choi975.workers.dev";
      const FUTURE_PREDICTION_COUNT = 12;
      const LOCAL_STORAGE_KEY = "sien-day.period-dates";
      const CACHE_VERSION = 1;
      const API_TIMEOUT_MS = 8000;
      const API_BASE_URL = getApiBaseUrl();
      const APP_STATE = Object.freeze({
        CHECKING: "checking",
        READY: "ready",
        UNAVAILABLE: "unavailable",
        SAVING: "saving",
      });

      let appState = APP_STATE.CHECKING;
      let dates = [];
      let draftDates = [];
      let connectionPromise = null;

      const els = {
        countdownCard: document.querySelector("#countdownCard"),
        nextDate: document.querySelector("#nextDate"),
        countdownPrefix: document.querySelector("#countdownPrefix"),
        daysLeft: document.querySelector("#daysLeft"),
        predictionText: document.querySelector("#predictionText"),
        status: document.querySelector("#status"),
        statusText: document.querySelector("#statusText"),
        offlineMessage: document.querySelector("#offlineMessage"),
        offlineMessageText: document.querySelector("#offlineMessageText"),
        retryConnection: document.querySelector("#retryConnection"),
        editor: document.querySelector("#editor"),
        openEditorButtons: document.querySelectorAll("[data-open-editor]"),
        closeEditor: document.querySelector("#closeEditor"),
        cancelEdit: document.querySelector("#cancelEdit"),
        dateList: document.querySelector("#dateList"),
        predictionList: document.querySelector("#predictionList"),
        predictionCount: document.querySelector("#predictionCount"),
        togglePredictions: document.querySelector("#togglePredictions"),
        recordToday: document.querySelector("#recordToday"),
        addDate: document.querySelector("#addDate"),
        editorForm: document.querySelector("#editorForm"),
        saveDates: document.querySelector("#saveDates"),
        saveIcon: document.querySelector("#saveIcon"),
        saveLabel: document.querySelector("#saveLabel"),
        editPassword: document.querySelector("#editPassword"),
        editorError: document.querySelector("#editorError"),
      };

      class HttpError extends Error {
        constructor(status, message) {
          super(message);
          this.name = "HttpError";
          this.status = status;
        }
      }

      class InvalidCloudResponseError extends Error {
        constructor(message) {
          super(message);
          this.name = "InvalidCloudResponseError";
        }
      }

      function getApiBaseUrl() {
        const host = window.location.hostname;
        if (window.location.protocol === "file:") return null;
        const isLocalDev = host === "localhost" || host === "127.0.0.1" || host === "[::1]";
        const isWorker = host.endsWith(".workers.dev");
        return isLocalDev || isWorker ? "" : WORKER_API_BASE_URL;
      }

      function isValidIsoDate(value) {
        if (typeof value !== "string") return false;
        const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
        if (!match) return false;

        const year = Number(match[1]);
        const month = Number(match[2]);
        const day = Number(match[3]);
        if (year < 1000 || month < 1 || month > 12 || day < 1) return false;

        const daysInMonth = new Date(Date.UTC(year, month, 0)).getUTCDate();
        return day <= daysInMonth;
      }

      function validateAndNormalizeDateList(values, { allowEmpty = false } = {}) {
        if (!Array.isArray(values) || values.some((value) => !isValidIsoDate(value))) {
          throw new TypeError("日期格式无效");
        }

        const normalized = [...new Set(values)].sort();
        if (!allowEmpty && !normalized.length) throw new TypeError("请至少保留一个日期");
        return normalized;
      }

      function parseDate(value) {
        const [year, month, day] = value.split("-").map(Number);
        return new Date(year, month - 1, day);
      }

      function toIsoDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function getTodayIsoDate() {
        return toIsoDate(new Date());
      }

      function formatChineseDate(value) {
        const date = parseDate(value);
        return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
      }

      function formatShortDate(value) {
        const date = parseDate(value);
        return `${date.getMonth() + 1}月${date.getDate()}日`;
      }

      function formatWeekdaySuffix(value, referenceDate = new Date()) {
        const weekdays = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
        const date = parseDate(value);
        const today = new Date(
          referenceDate.getFullYear(),
          referenceDate.getMonth(),
          referenceDate.getDate(),
        );
        const currentMonday = new Date(today);
        currentMonday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
        const currentSunday = new Date(currentMonday);
        currentSunday.setDate(currentMonday.getDate() + 6);
        const nextMonday = new Date(currentMonday);
        nextMonday.setDate(currentMonday.getDate() + 7);
        const nextSunday = new Date(currentMonday);
        nextSunday.setDate(currentMonday.getDate() + 13);

        if (date >= currentMonday && date <= currentSunday) {
          return `（${weekdays[date.getDay()]}）`;
        }

        if (date >= nextMonday && date <= nextSunday) {
          return `（下周${weekdays[date.getDay()].replace("周", "")}）`;
        }

        return "";
      }

      function formatListDate(value) {
        return value.split("-").join(" / ");
      }

      function formatSyncTime(value) {
        if (typeof value !== "string") return "";
        const timestamp = new Date(value);
        if (Number.isNaN(timestamp.getTime())) return "";

        return new Intl.DateTimeFormat("zh-CN", {
          month: "numeric",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        }).format(timestamp);
      }

      function daysBetween(from, to) {
        const msPerDay = 24 * 60 * 60 * 1000;
        const start = Date.UTC(from.getFullYear(), from.getMonth(), from.getDate());
        const end = Date.UTC(to.getFullYear(), to.getMonth(), to.getDate());
        return Math.round((end - start) / msPerDay);
      }

      function addDays(value, days) {
        const date = parseDate(value);
        date.setDate(date.getDate() + days);
        return toIsoDate(date);
      }

      function getLatestInterval(sourceDates) {
        const sorted = [...sourceDates].sort();
        const last = sorted[sorted.length - 1];
        const previous = sorted[sorted.length - 2];
        return previous ? daysBetween(parseDate(previous), parseDate(last)) : 28;
      }

      function buildFuturePredictions(sourceDates, count = FUTURE_PREDICTION_COUNT) {
        const sorted = [...sourceDates].sort();
        if (!sorted.length) return [];

        const interval = getLatestInterval(sorted);
        const predictions = [];
        let current = sorted[sorted.length - 1];

        for (let index = 0; index < count; index += 1) {
          current = addDays(current, interval);
          predictions.push(current);
        }

        return predictions;
      }

      function getPrediction(sourceDates) {
        const interval = getLatestInterval(sourceDates);
        const next = buildFuturePredictions(sourceDates, 1)[0];
        const today = new Date();
        const todayOnly = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        const remaining = daysBetween(todayOnly, parseDate(next));

        return { next, interval, remaining };
      }

      function readLocalCache() {
        try {
          const raw = window.localStorage.getItem(LOCAL_STORAGE_KEY);
          if (!raw) return null;

          const stored = JSON.parse(raw);
          if (Array.isArray(stored)) {
            return {
              version: CACHE_VERSION,
              dates: validateAndNormalizeDateList(stored),
              syncedAt: null,
              isLegacy: true,
            };
          }

          if (!stored || stored.version !== CACHE_VERSION) return null;
          return {
            version: CACHE_VERSION,
            dates: validateAndNormalizeDateList(stored.dates),
            syncedAt: formatSyncTime(stored.syncedAt) ? stored.syncedAt : null,
            isLegacy: false,
          };
        } catch {
          return null;
        }
      }

      function writeLocalCache(values) {
        const normalizedDates = validateAndNormalizeDateList(values);
        const cache = {
          version: CACHE_VERSION,
          dates: normalizedDates,
          syncedAt: new Date().toISOString(),
        };

        try {
          window.localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(cache));
        } catch {
          // Storage restrictions must not block cloud-backed use of the page.
        }

        return cache;
      }

      function extractCloudDates(data) {
        if (!data || !Array.isArray(data.dates)) {
          throw new InvalidCloudResponseError("云端日期响应格式无效");
        }

        const values = data.dates.map((item) => {
          if (typeof item === "string") return item;
          if (item && typeof item.date === "string") return item.date;
          throw new InvalidCloudResponseError("云端日期响应包含无效记录");
        });

        try {
          return validateAndNormalizeDateList(values);
        } catch {
          throw new InvalidCloudResponseError("云端日期响应包含无效日期");
        }
      }

      async function readResponseJson(response) {
        const data = await response.json().catch(() => null);
        if (data === null) throw new InvalidCloudResponseError("云端返回了无法解析的响应");
        return data;
      }

      async function fetchApi(path, options = {}) {
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), API_TIMEOUT_MS);

        try {
          return await fetch(`${API_BASE_URL}${path}`, {
            cache: "no-store",
            ...options,
            signal: controller.signal,
          });
        } finally {
          window.clearTimeout(timeout);
        }
      }

      function renderCountdown() {
        if (!dates.length) {
          els.nextDate.textContent = "正在读取日期";
          els.countdownPrefix.textContent = "还有";
          els.countdownPrefix.classList.remove("overdue");
          els.daysLeft.textContent = "--";
          els.predictionText.textContent =
            appState === APP_STATE.UNAVAILABLE
              ? "暂无本机缓存，请重试连接云端"
              : "暂无本机缓存，正在读取云端日期记录";
          return;
        }

        const prediction = getPrediction(dates);
        const isOverdue = prediction.remaining < 0;
        const nextDateLabel = `${isOverdue ? "原预计" : "预计"} ${formatShortDate(
          prediction.next,
        )}${formatWeekdaySuffix(prediction.next)}`;
        els.nextDate.textContent = nextDateLabel;
        els.countdownPrefix.textContent = isOverdue ? "已晚" : "还有";
        els.countdownPrefix.classList.toggle("overdue", isOverdue);
        els.daysLeft.textContent = Math.abs(prediction.remaining);
        els.predictionText.textContent = !isOverdue
          ? `按最近一次间隔 ${prediction.interval} 天预测`
          : appState === APP_STATE.READY
            ? `预测日期已过去 ${Math.abs(prediction.remaining)} 天，请点击编辑校准`
            : `预测日期已过去 ${Math.abs(prediction.remaining)} 天，连接云端后可编辑校准`;
      }

      function updateEditorInteractivity() {
        const isReadOnly = appState !== APP_STATE.READY;
        els.addDate.disabled = isReadOnly;
        els.recordToday.disabled = isReadOnly;
        els.saveDates.disabled = isReadOnly;
        els.editPassword.disabled = isReadOnly;
        const isSaving = appState === APP_STATE.SAVING;
        els.saveLabel.textContent = isSaving ? "保存中" : "保存";
        els.saveIcon.style.setProperty(
          "--icon-src",
          `url('icons/${isSaving ? "refresh-cw" : "check"}.svg')`,
        );
        els.saveIcon.classList.toggle("spin", isSaving);

        els.dateList.querySelectorAll("input[data-date-kind='confirmed']").forEach((input) => {
          input.disabled = isReadOnly;
        });
        els.dateList.querySelectorAll("button").forEach((button) => {
          button.disabled = isReadOnly;
        });
      }

      function setAppState(nextState, { message = "", isError = false, showRetry } = {}) {
        appState = nextState;
        const canEdit = nextState === APP_STATE.READY && dates.length > 0;
        const isBusy = nextState === APP_STATE.CHECKING || nextState === APP_STATE.SAVING;

        els.countdownCard.setAttribute("aria-busy", String(isBusy));
        els.openEditorButtons.forEach((button) => {
          button.disabled = !canEdit;
          button.title = canEdit ? "更新生理期日期" : "连接云端后才能编辑";
        });
        els.statusText.textContent = message;
        els.status.classList.toggle("offline", nextState === APP_STATE.UNAVAILABLE || isError);
        const shouldShowRetry = showRetry ?? nextState === APP_STATE.UNAVAILABLE;
        els.offlineMessage.hidden = nextState !== APP_STATE.UNAVAILABLE;
        if (nextState === APP_STATE.UNAVAILABLE) {
          els.offlineMessageText.textContent = dates.length
            ? "云端暂不可用，当前显示缓存"
            : "云端暂不可用，暂无缓存";
        }
        els.retryConnection.hidden = !shouldShowRetry || API_BASE_URL === null;
        els.retryConnection.disabled = isBusy;
        renderCountdown();
        updateEditorInteractivity();
      }

      function getCheckingMessage() {
        return "正在连接云端";
      }

      function getUnavailableMessage() {
        return dates.length ? "显示上次缓存 · 只读" : "云端不可用 · 暂无缓存";
      }

      async function connectToCloud({ cache = null } = {}) {
        if (connectionPromise) return connectionPromise;

        if (API_BASE_URL === null) {
          setAppState(APP_STATE.UNAVAILABLE, {
            message: dates.length ? "显示本机缓存 · 只读" : "本地模式 · 暂无缓存",
            showRetry: false,
          });
          return null;
        }

        setAppState(APP_STATE.CHECKING, { message: getCheckingMessage(cache) });
        connectionPromise = (async () => {
          try {
            const response = await fetchApi("/api/period-dates", {
              headers: { accept: "application/json" },
            });
            const data = await readResponseJson(response);
            if (!response.ok) throw new HttpError(response.status, data.error || "云端读取失败");

            const cloudDates = extractCloudDates(data);
            dates = cloudDates;
            writeLocalCache(cloudDates);
            setAppState(APP_STATE.READY, { message: "云端已同步" });
          } catch {
            setAppState(APP_STATE.UNAVAILABLE, { message: getUnavailableMessage(), showRetry: true });
          } finally {
            connectionPromise = null;
          }
        })();

        return connectionPromise;
      }

      function renderEditor() {
        const isReadOnly = appState !== APP_STATE.READY;
        const confirmedRows = draftDates.map((date, index) => ({ date, index })).reverse();
        const predictedDates = buildFuturePredictions(draftDates);
        const todayValue = getTodayIsoDate();
        const isTodayRecorded = draftDates.includes(todayValue);
        const nextPrediction = predictedDates[0];
        const daysFromTodayToPrediction = nextPrediction
          ? daysBetween(parseDate(todayValue), parseDate(nextPrediction))
          : Number.POSITIVE_INFINITY;
        const isInRecordWindow = daysFromTodayToPrediction >= -5 && daysFromTodayToPrediction <= 5;

        els.dateList.innerHTML = confirmedRows
          .map(
            ({ date, index }) => `
              <div class="date-row">
                <input
                  class="date-input"
                  type="date"
                  value="${date}"
                  data-date-kind="confirmed"
                  ${isReadOnly ? "disabled" : ""}
                  aria-label="生理期日期 ${formatChineseDate(date)}"
                />
                <button
                  class="row-icon-button"
                  type="button"
                  data-remove="${index}"
                  title="删除 ${formatChineseDate(date)}"
                  aria-label="删除 ${formatChineseDate(date)}"
                  ${isReadOnly ? "disabled" : ""}
                >
                  <span class="icon" style="--icon-src: url('icons/trash-2.svg')" aria-hidden="true"></span>
                </button>
              </div>
            `,
          )
          .join("");

        els.predictionList.innerHTML = predictedDates
          .map(
            (date) => `
              <div class="prediction-row">
                <span>${formatListDate(date)}</span>
                <small>预测</small>
              </div>
            `,
          )
          .join("");
        els.predictionCount.textContent = `${predictedDates.length} 条`;
        els.recordToday.hidden = isTodayRecorded || !isInRecordWindow;
        els.recordToday.setAttribute("aria-label", `把今天 ${formatChineseDate(todayValue)} 记为生理期日期`);

        updateEditorInteractivity();
      }

      function setEditorError(message = "") {
        els.editorError.textContent = message;
      }

      function resetEditor() {
        draftDates = [];
        els.editPassword.value = "";
        els.togglePredictions.setAttribute("aria-expanded", "false");
        els.predictionList.hidden = true;
        setEditorError();
      }

      async function saveDates(nextDates, password) {
        if (appState !== APP_STATE.READY) return;

        let normalizedDates;
        try {
          normalizedDates = validateAndNormalizeDateList(nextDates);
        } catch (error) {
          setEditorError(`${error.message}。`);
          return;
        }

        if (!password) {
          setEditorError("请输入编辑密码。");
          els.editPassword.focus();
          return;
        }
        if (/[\r\n]/.test(password)) {
          setEditorError("编辑密码不能包含换行符。");
          els.editPassword.focus();
          return;
        }

        setEditorError();
        setAppState(APP_STATE.SAVING, { message: "正在保存" });

        try {
          const response = await fetchApi("/api/period-dates", {
            method: "PUT",
            headers: {
              authorization: `Bearer ${password}`,
              "content-type": "application/json",
              accept: "application/json",
            },
            body: JSON.stringify({ dates: normalizedDates }),
          });
          const data = await readResponseJson(response);

          if (response.status === 401 || response.status === 403) {
            setAppState(APP_STATE.READY, { message: "云端已同步 · 修改未保存" });
            els.editPassword.value = "";
            setEditorError("编辑密码错误，请重新输入后再试。");
            els.editPassword.focus();
            return;
          }
          if (!response.ok) throw new HttpError(response.status, data.error || "云端保存失败");

          const savedDates = extractCloudDates(data);
          dates = savedDates;
          writeLocalCache(savedDates);
          els.editPassword.value = "";
          els.editor.close();
          setAppState(APP_STATE.READY, { message: "云端已同步" });
        } catch (error) {
          if (error instanceof HttpError && error.status < 500) {
            setAppState(APP_STATE.READY, {
              message: "云端保存失败，已保留原有日期",
              isError: true,
            });
            setEditorError(`${error.message}，本机缓存和当前倒计时均未修改。`);
            return;
          }

          els.editPassword.value = "";
          setAppState(APP_STATE.UNAVAILABLE, {
            message: "保存未成功，已保留原有日期（只读）",
            isError: true,
            showRetry: true,
          });
          setEditorError(
            error instanceof HttpError
              ? `${error.message}，本机缓存和当前倒计时均未修改。关闭窗口后可重试连接。`
              : "未能确认云端保存结果，本机缓存和当前倒计时均未修改。关闭窗口后可重试连接。",
          );
        }
      }

      function openEditor() {
        if (appState !== APP_STATE.READY || !dates.length) return;
        draftDates = [...dates];
        els.editPassword.value = "";
        setEditorError();
        renderEditor();
        els.editor.showModal();
        els.editor.focus({ preventScroll: true });
      }

      els.openEditorButtons.forEach((button) => button.addEventListener("click", openEditor));

      els.closeEditor.addEventListener("click", () => els.editor.close());
      els.cancelEdit.addEventListener("click", () => els.editor.close());
      els.editor.addEventListener("close", resetEditor);
      els.editor.addEventListener("click", (event) => {
        if (event.target === els.editor) els.editor.close();
      });

      els.addDate.addEventListener("click", () => {
        if (appState !== APP_STATE.READY) return;
        const next = draftDates.length ? getPrediction(draftDates).next : getTodayIsoDate();
        draftDates = validateAndNormalizeDateList([...draftDates, next]);
        setEditorError();
        renderEditor();
      });

      els.dateList.addEventListener("input", (event) => {
        if (appState !== APP_STATE.READY || !event.target.matches("input[data-date-kind='confirmed']")) return;

        const values = [...els.dateList.querySelectorAll("input[data-date-kind='confirmed']")].map(
          (input) => input.value,
        );
        try {
          draftDates = validateAndNormalizeDateList(values, { allowEmpty: true });
          setEditorError();
          renderEditor();
        } catch {
          setEditorError("请选择有效的日期。");
        }
      });

      els.dateList.addEventListener("click", (event) => {
        if (appState !== APP_STATE.READY) return;

        const removeButton = event.target.closest("[data-remove]");
        if (!removeButton) return;
        draftDates.splice(Number(removeButton.dataset.remove), 1);
        draftDates = validateAndNormalizeDateList(draftDates, { allowEmpty: true });
        setEditorError();
        renderEditor();
      });

      els.recordToday.addEventListener("click", () => {
        if (appState !== APP_STATE.READY) return;
        const todayValue = getTodayIsoDate();
        const nextDates = validateAndNormalizeDateList([...draftDates, todayValue]);
        if (nextDates.length === draftDates.length) {
          setEditorError("今天已经记录过了。");
          return;
        }

        draftDates = nextDates;
        setEditorError();
        renderEditor();
      });

      els.togglePredictions.addEventListener("click", () => {
        const isOpen = els.togglePredictions.getAttribute("aria-expanded") === "true";
        els.togglePredictions.setAttribute("aria-expanded", String(!isOpen));
        els.predictionList.hidden = isOpen;
      });

      els.editorForm.addEventListener("submit", (event) => {
        event.preventDefault();
        if (appState !== APP_STATE.READY) return;

        const values = [...els.dateList.querySelectorAll("input[data-date-kind='confirmed']")].map(
          (input) => input.value,
        );
        saveDates(values, els.editPassword.value);
      });

      els.retryConnection.addEventListener("click", () => {
        if (appState !== APP_STATE.UNAVAILABLE) return;
        connectToCloud();
      });

      window.addEventListener("online", () => {
        if (appState === APP_STATE.UNAVAILABLE) connectToCloud();
      });

      window.addEventListener("offline", () => {
        if (appState !== APP_STATE.READY) return;
        els.editPassword.value = "";
        setAppState(APP_STATE.UNAVAILABLE, {
          message: getUnavailableMessage(),
          showRetry: true,
        });
      });

      function initialize() {
        const cache = readLocalCache();
        if (cache) dates = cache.dates;

        // Render synchronously before the first network await so cached data is visible immediately.
        renderCountdown();
        setAppState(APP_STATE.CHECKING, { message: getCheckingMessage(cache) });
        void connectToCloud({ cache });
      }

      initialize();
    </script>
  </body>
</html>
