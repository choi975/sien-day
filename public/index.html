<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>生理期倒计时</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7eef2;
        --panel: rgba(255, 255, 255, 0.78);
        --panel-strong: #ffffff;
        --text: #32252b;
        --muted: #7b6871;
        --primary: #c83f6b;
        --primary-strong: #a92f57;
        --ring: rgba(200, 63, 107, 0.24);
        --border: rgba(83, 55, 66, 0.14);
        --shadow: 0 24px 80px rgba(136, 56, 88, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
          sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(244, 173, 194, 0.5), transparent 32rem),
          linear-gradient(135deg, #fff7f9 0%, var(--bg) 52%, #f1f6ff 100%);
      }

      button,
      input {
        font: inherit;
      }

      .app {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 18px;
      }

      .card {
        width: min(760px, 100%);
        min-height: min(560px, calc(100vh - 64px));
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 28px;
        padding: clamp(24px, 5vw, 48px);
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--panel);
        box-shadow: var(--shadow);
        backdrop-filter: blur(20px);
      }

      .topline {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        text-align: center;
        color: var(--muted);
        font-size: clamp(16px, 2.5vw, 22px);
        line-height: 1.55;
      }

      .next-date {
        color: var(--text);
        font-weight: 800;
      }

      .edit-button {
        border: 1px solid rgba(200, 63, 107, 0.3);
        border-radius: 999px;
        padding: 8px 15px;
        color: var(--primary-strong);
        background: rgba(255, 255, 255, 0.78);
        cursor: pointer;
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          background 160ms ease;
      }

      .edit-button:hover {
        transform: translateY(-1px);
        border-color: var(--primary);
        background: #fff;
      }

      .edit-button:disabled {
        transform: none;
        border-color: var(--border);
        color: var(--muted);
        background: rgba(255, 255, 255, 0.52);
        cursor: not-allowed;
        opacity: 0.72;
      }

      .countdown {
        display: grid;
        place-items: center;
        text-align: center;
      }

      .countdown-label {
        margin: 0;
        color: var(--muted);
        font-size: clamp(22px, 4vw, 34px);
        letter-spacing: 0;
      }

      .days {
        display: inline-block;
        min-width: 1.5em;
        color: var(--primary);
        font-size: clamp(86px, 20vw, 188px);
        font-weight: 900;
        line-height: 0.96;
        letter-spacing: 0;
        text-shadow: 0 18px 42px rgba(200, 63, 107, 0.24);
      }

      .subcopy {
        margin: 18px 0 0;
        color: var(--muted);
        font-size: clamp(15px, 2vw, 18px);
      }

      .status {
        min-height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 14px;
        text-align: center;
      }

      .retry-button {
        border: 1px solid rgba(200, 63, 107, 0.28);
        border-radius: 999px;
        padding: 5px 11px;
        color: var(--primary-strong);
        background: rgba(255, 255, 255, 0.82);
        cursor: pointer;
      }

      .retry-button:hover {
        border-color: var(--primary);
        background: #fff;
      }

      .retry-button:disabled {
        cursor: wait;
        opacity: 0.58;
      }

      dialog {
        width: min(720px, calc(100vw - 32px));
        border: 0;
        border-radius: 24px;
        padding: 0;
        color: var(--text);
        background: var(--panel-strong);
        box-shadow: 0 30px 90px rgba(50, 37, 43, 0.28);
      }

      dialog::backdrop {
        background: rgba(44, 32, 38, 0.34);
        backdrop-filter: blur(6px);
      }

      .modal {
        display: grid;
        gap: 20px;
        padding: 24px;
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: start;
      }

      .modal-title {
        margin: 0;
        font-size: 22px;
      }

      .modal-note {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .password-field {
        display: grid;
        gap: 7px;
      }

      .password-label {
        color: var(--text);
        font-size: 14px;
        font-weight: 700;
      }

      .password-field input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px 13px;
        color: var(--text);
        background: #fff;
        outline: none;
      }

      .password-field input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px var(--ring);
      }

      .password-help,
      .editor-error {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .editor-error {
        min-height: 20px;
        color: #ba254d;
      }

      .icon-button {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 50%;
        color: var(--muted);
        background: #fff;
        cursor: pointer;
      }

      .date-list {
        display: grid;
        gap: 12px;
        max-height: min(58vh, 520px);
        overflow: auto;
        padding-right: 4px;
      }

      .date-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 10px;
        align-items: center;
      }

      .date-row input {
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px 13px;
        color: var(--text);
        background: #fff;
        outline: none;
      }

      .date-row input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px var(--ring);
      }

      .date-row.prediction input {
        color: var(--muted);
        background: #fbf8fa;
        border-style: dashed;
      }

      .gap {
        min-width: 112px;
        color: var(--muted);
        font-size: 14px;
        text-align: right;
      }

      .row-actions {
        min-width: 164px;
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      .remove,
      .quick-today {
        border: 0;
        border-radius: 12px;
        padding: 10px 12px;
        white-space: nowrap;
        cursor: pointer;
      }

      .remove {
        color: #8b2d46;
        background: #fff1f5;
      }

      .quick-today {
        border: 1px solid rgba(200, 63, 107, 0.28);
        color: var(--primary-strong);
        background: #fff;
      }

      .quick-today:disabled {
        color: var(--muted);
        opacity: 0.58;
        cursor: default;
      }

      .modal-actions {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .left-actions,
      .right-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .button {
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 11px 16px;
        color: var(--text);
        background: #fff;
        cursor: pointer;
      }

      .button.primary {
        border-color: var(--primary);
        color: #fff;
        background: var(--primary);
      }

      .button.primary:hover {
        background: var(--primary-strong);
      }

      .button:disabled {
        opacity: 0.55;
        cursor: wait;
      }

      .error {
        color: #ba254d;
      }

      @media (max-width: 560px) {
        .card {
          border-radius: 22px;
        }

        .date-row {
          grid-template-columns: 1fr auto;
        }

        .gap {
          grid-column: 1 / -1;
          text-align: left;
        }

        .row-actions {
          grid-column: 1 / -1;
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="card" id="countdownCard" aria-label="生理期倒计时" aria-busy="true">
        <header class="topline">
          <span>下一次生理期预计为 <span class="next-date" id="nextDate">加载中</span></span>
          <button class="edit-button" id="openEditor" type="button" aria-describedby="statusText" disabled>编辑</button>
        </header>

        <section class="countdown" aria-live="polite">
          <div>
            <p class="countdown-label"><span id="countdownPrefix">倒计时</span> <span class="days" id="daysLeft">--</span> 天</p>
            <p class="subcopy" id="predictionText">正在读取云端日期记录</p>
          </div>
        </section>

        <footer>
          <div class="status" id="status" role="status" aria-live="polite">
            <span id="statusText">正在连接云端，当前为只读状态</span>
            <button class="retry-button" id="retryConnection" type="button" hidden>重试连接</button>
          </div>
        </footer>
      </section>
    </main>

    <dialog id="editor">
      <form class="modal" id="editorForm" method="dialog">
        <div class="modal-header">
          <div>
            <h2 class="modal-title">校准生理期日期</h2>
            <p class="modal-note">已发生日期显示“间隔”，预测日期显示“预计间隔”。修改仅在云端连接正常时开放。</p>
          </div>
          <button class="icon-button" id="closeEditor" type="button" aria-label="关闭">×</button>
        </div>

        <label class="password-field" for="editPassword">
          <span class="password-label">编辑密码</span>
          <input id="editPassword" type="password" autocomplete="current-password" required aria-describedby="passwordHelp editorError" />
          <span class="password-help" id="passwordHelp">密码只用于本次云端保存，不会写入本机缓存。</span>
        </label>

        <p class="editor-error" id="editorError" role="alert" aria-live="assertive"></p>

        <div class="date-list" id="dateList"></div>

        <div class="modal-actions">
          <div class="left-actions">
            <button class="button" id="addDate" type="button">添加日期</button>
          </div>
          <div class="right-actions">
            <button class="button" id="cancelEdit" type="button">取消</button>
            <button class="button primary" id="saveDates" type="submit">保存</button>
          </div>
        </div>
      </form>
    </dialog>

    <script>
      const WORKER_API_BASE_URL = "https://sien-day.choi975.workers.dev";
      const FUTURE_PREDICTION_COUNT = 12;
      const LOCAL_STORAGE_KEY = "sien-day.period-dates";
      const CACHE_VERSION = 1;
      const API_TIMEOUT_MS = 8000;
      const API_BASE_URL = getApiBaseUrl();
      const APP_STATE = Object.freeze({
        CHECKING: "checking",
        READY: "ready",
        UNAVAILABLE: "unavailable",
        SAVING: "saving",
      });

      let appState = APP_STATE.CHECKING;
      let dates = [];
      let draftDates = [];
      let connectionPromise = null;

      const els = {
        countdownCard: document.querySelector("#countdownCard"),
        nextDate: document.querySelector("#nextDate"),
        countdownPrefix: document.querySelector("#countdownPrefix"),
        daysLeft: document.querySelector("#daysLeft"),
        predictionText: document.querySelector("#predictionText"),
        statusText: document.querySelector("#statusText"),
        retryConnection: document.querySelector("#retryConnection"),
        editor: document.querySelector("#editor"),
        openEditor: document.querySelector("#openEditor"),
        closeEditor: document.querySelector("#closeEditor"),
        cancelEdit: document.querySelector("#cancelEdit"),
        dateList: document.querySelector("#dateList"),
        addDate: document.querySelector("#addDate"),
        editorForm: document.querySelector("#editorForm"),
        saveDates: document.querySelector("#saveDates"),
        editPassword: document.querySelector("#editPassword"),
        editorError: document.querySelector("#editorError"),
      };

      class HttpError extends Error {
        constructor(status, message) {
          super(message);
          this.name = "HttpError";
          this.status = status;
        }
      }

      class InvalidCloudResponseError extends Error {
        constructor(message) {
          super(message);
          this.name = "InvalidCloudResponseError";
        }
      }

      function getApiBaseUrl() {
        const host = window.location.hostname;
        if (window.location.protocol === "file:") return null;
        const isLocalDev = host === "localhost" || host === "127.0.0.1" || host === "[::1]";
        const isWorker = host.endsWith(".workers.dev");
        return isLocalDev || isWorker ? "" : WORKER_API_BASE_URL;
      }

      function isValidIsoDate(value) {
        if (typeof value !== "string") return false;
        const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
        if (!match) return false;

        const year = Number(match[1]);
        const month = Number(match[2]);
        const day = Number(match[3]);
        if (year < 1000 || month < 1 || month > 12 || day < 1) return false;

        const daysInMonth = new Date(Date.UTC(year, month, 0)).getUTCDate();
        return day <= daysInMonth;
      }

      function validateAndNormalizeDateList(values, { allowEmpty = false } = {}) {
        if (!Array.isArray(values) || values.some((value) => !isValidIsoDate(value))) {
          throw new TypeError("日期格式无效");
        }

        const normalized = [...new Set(values)].sort();
        if (!allowEmpty && !normalized.length) throw new TypeError("请至少保留一个日期");
        return normalized;
      }

      function parseDate(value) {
        const [year, month, day] = value.split("-").map(Number);
        return new Date(year, month - 1, day);
      }

      function toIsoDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function getTodayIsoDate() {
        return toIsoDate(new Date());
      }

      function formatChineseDate(value) {
        const date = parseDate(value);
        return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
      }

      function formatSyncTime(value) {
        if (typeof value !== "string") return "";
        const timestamp = new Date(value);
        if (Number.isNaN(timestamp.getTime())) return "";

        return new Intl.DateTimeFormat("zh-CN", {
          month: "numeric",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        }).format(timestamp);
      }

      function daysBetween(from, to) {
        const msPerDay = 24 * 60 * 60 * 1000;
        const start = Date.UTC(from.getFullYear(), from.getMonth(), from.getDate());
        const end = Date.UTC(to.getFullYear(), to.getMonth(), to.getDate());
        return Math.round((end - start) / msPerDay);
      }

      function addDays(value, days) {
        const date = parseDate(value);
        date.setDate(date.getDate() + days);
        return toIsoDate(date);
      }

      function getLatestInterval(sourceDates) {
        const sorted = [...sourceDates].sort();
        const last = sorted[sorted.length - 1];
        const previous = sorted[sorted.length - 2];
        return previous ? daysBetween(parseDate(previous), parseDate(last)) : 28;
      }

      function buildFuturePredictions(sourceDates, count = FUTURE_PREDICTION_COUNT) {
        const sorted = [...sourceDates].sort();
        if (!sorted.length) return [];

        const interval = getLatestInterval(sorted);
        const predictions = [];
        let current = sorted[sorted.length - 1];

        for (let index = 0; index < count; index += 1) {
          current = addDays(current, interval);
          predictions.push(current);
        }

        return predictions;
      }

      function getPrediction(sourceDates) {
        const interval = getLatestInterval(sourceDates);
        const next = buildFuturePredictions(sourceDates, 1)[0];
        const today = new Date();
        const todayOnly = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        const remaining = daysBetween(todayOnly, parseDate(next));

        return { next, interval, remaining };
      }

      function readLocalCache() {
        try {
          const raw = window.localStorage.getItem(LOCAL_STORAGE_KEY);
          if (!raw) return null;

          const stored = JSON.parse(raw);
          if (Array.isArray(stored)) {
            return {
              version: CACHE_VERSION,
              dates: validateAndNormalizeDateList(stored),
              syncedAt: null,
              isLegacy: true,
            };
          }

          if (!stored || stored.version !== CACHE_VERSION) return null;
          return {
            version: CACHE_VERSION,
            dates: validateAndNormalizeDateList(stored.dates),
            syncedAt: formatSyncTime(stored.syncedAt) ? stored.syncedAt : null,
            isLegacy: false,
          };
        } catch {
          return null;
        }
      }

      function writeLocalCache(values) {
        const normalizedDates = validateAndNormalizeDateList(values);
        const cache = {
          version: CACHE_VERSION,
          dates: normalizedDates,
          syncedAt: new Date().toISOString(),
        };

        try {
          window.localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(cache));
        } catch {
          // Storage restrictions must not block cloud-backed use of the page.
        }

        return cache;
      }

      function extractCloudDates(data) {
        if (!data || !Array.isArray(data.dates)) {
          throw new InvalidCloudResponseError("云端日期响应格式无效");
        }

        const values = data.dates.map((item) => {
          if (typeof item === "string") return item;
          if (item && typeof item.date === "string") return item.date;
          throw new InvalidCloudResponseError("云端日期响应包含无效记录");
        });

        try {
          return validateAndNormalizeDateList(values);
        } catch {
          throw new InvalidCloudResponseError("云端日期响应包含无效日期");
        }
      }

      async function readResponseJson(response) {
        const data = await response.json().catch(() => null);
        if (data === null) throw new InvalidCloudResponseError("云端返回了无法解析的响应");
        return data;
      }

      async function fetchApi(path, options = {}) {
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), API_TIMEOUT_MS);

        try {
          return await fetch(`${API_BASE_URL}${path}`, {
            cache: "no-store",
            ...options,
            signal: controller.signal,
          });
        } finally {
          window.clearTimeout(timeout);
        }
      }

      function renderCountdown() {
        if (!dates.length) {
          els.nextDate.textContent = "等待云端";
          els.countdownPrefix.textContent = "倒计时";
          els.daysLeft.textContent = "--";
          els.predictionText.textContent =
            appState === APP_STATE.UNAVAILABLE
              ? "暂无本机缓存，请重试连接云端"
              : "暂无本机缓存，正在读取云端日期记录";
          return;
        }

        const prediction = getPrediction(dates);
        const isOverdue = prediction.remaining < 0;
        els.nextDate.textContent = formatChineseDate(prediction.next);
        els.countdownPrefix.textContent = isOverdue ? "已逾期" : "倒计时";
        els.daysLeft.textContent = Math.abs(prediction.remaining);
        els.predictionText.textContent = !isOverdue
          ? `按最近一次间隔 ${prediction.interval} 天预测`
          : appState === APP_STATE.READY
            ? `预测日期已过去 ${Math.abs(prediction.remaining)} 天，请点击编辑校准`
            : `预测日期已过去 ${Math.abs(prediction.remaining)} 天，连接云端后可编辑校准`;
      }

      function updateEditorInteractivity() {
        const isReadOnly = appState !== APP_STATE.READY;
        els.addDate.disabled = isReadOnly;
        els.saveDates.disabled = isReadOnly;
        els.editPassword.disabled = isReadOnly;
        els.saveDates.textContent = appState === APP_STATE.SAVING ? "保存中" : "保存";

        els.dateList.querySelectorAll("input[data-date-kind='confirmed']").forEach((input) => {
          input.disabled = isReadOnly;
        });
        els.dateList.querySelectorAll("button").forEach((button) => {
          button.disabled = isReadOnly;
        });
      }

      function setAppState(nextState, { message = "", isError = false, showRetry } = {}) {
        appState = nextState;
        const canEdit = nextState === APP_STATE.READY && dates.length > 0;
        const isBusy = nextState === APP_STATE.CHECKING || nextState === APP_STATE.SAVING;

        els.countdownCard.setAttribute("aria-busy", String(isBusy));
        els.openEditor.disabled = !canEdit;
        els.openEditor.title = canEdit ? "校准生理期日期" : "连接云端后才能编辑";
        els.statusText.textContent = message;
        els.statusText.classList.toggle("error", isError);
        const shouldShowRetry = showRetry ?? nextState === APP_STATE.UNAVAILABLE;
        els.retryConnection.hidden = !shouldShowRetry || API_BASE_URL === null;
        els.retryConnection.disabled = isBusy;
        renderCountdown();
        updateEditorInteractivity();
      }

      function getCheckingMessage(cache) {
        if (!cache) return "正在连接云端，当前为只读状态";
        if (cache.isLegacy) return "正在连接云端，当前显示旧版本机缓存（只读）";

        const syncTime = formatSyncTime(cache.syncedAt);
        return syncTime
          ? `正在连接云端，当前显示 ${syncTime} 同步的缓存（只读）`
          : "正在连接云端，当前显示上次同步缓存（只读）";
      }

      function getUnavailableMessage() {
        return dates.length
          ? "云端暂不可用，当前显示上次同步缓存（只读）"
          : "云端暂不可用且暂无本机缓存（只读）";
      }

      async function connectToCloud({ cache = null } = {}) {
        if (connectionPromise) return connectionPromise;

        if (API_BASE_URL === null) {
          setAppState(APP_STATE.UNAVAILABLE, {
            message: dates.length
              ? "本地文件模式无法连接云端，当前显示本机缓存（只读）"
              : "本地文件模式无法连接云端，且暂无本机缓存（只读）",
            showRetry: false,
          });
          return null;
        }

        setAppState(APP_STATE.CHECKING, { message: getCheckingMessage(cache) });
        connectionPromise = (async () => {
          try {
            const response = await fetchApi("/api/period-dates", {
              headers: { accept: "application/json" },
            });
            const data = await readResponseJson(response);
            if (!response.ok) throw new HttpError(response.status, data.error || "云端读取失败");

            const cloudDates = extractCloudDates(data);
            dates = cloudDates;
            writeLocalCache(cloudDates);
            setAppState(APP_STATE.READY, { message: "已连接云端，日期可编辑" });
          } catch {
            setAppState(APP_STATE.UNAVAILABLE, { message: getUnavailableMessage(), showRetry: true });
          } finally {
            connectionPromise = null;
          }
        })();

        return connectionPromise;
      }

      function renderEditor() {
        const isReadOnly = appState !== APP_STATE.READY;
        const rows = [
          ...draftDates.map((date) => ({ date, isPrediction: false })),
          ...buildFuturePredictions(draftDates).map((date) => ({ date, isPrediction: true })),
        ];
        const todayValue = getTodayIsoDate();
        const isTodayRecorded = draftDates.includes(todayValue);
        const nextPrediction = buildFuturePredictions(draftDates, 1)[0];
        const daysFromTodayToPrediction = nextPrediction
          ? daysBetween(parseDate(todayValue), parseDate(nextPrediction))
          : Number.POSITIVE_INFINITY;
        const isInRecordWindow = daysFromTodayToPrediction >= -5 && daysFromTodayToPrediction <= 5;
        const firstPredictionIndex = draftDates.length;

        els.dateList.innerHTML = rows
          .map((row, index) => {
            const previous = rows[index - 1]?.date;
            const gap = previous
              ? `${row.isPrediction ? "预计间隔" : "间隔"}${daysBetween(parseDate(previous), parseDate(row.date))}天`
              : "";
            const showTodayButton = !isTodayRecorded && isInRecordWindow && index === firstPredictionIndex;
            const disabled = row.isPrediction || isReadOnly ? "disabled" : "";
            const actionButtons = [
              row.isPrediction
                ? ""
                : `<button class="remove" type="button" data-remove="${index}" aria-label="删除 ${formatChineseDate(row.date)}" ${isReadOnly ? "disabled" : ""}>删除</button>`,
              showTodayButton
                ? `<button class="quick-today" type="button" data-record-today="true" aria-label="把今天 ${formatChineseDate(todayValue)} 记为明确日期" ${isReadOnly ? "disabled" : ""}>记为今天</button>`
                : "",
            ]
              .filter(Boolean)
              .join("");
            return `
              <div class="date-row ${row.isPrediction ? "prediction" : ""}" data-index="${index}">
                <input type="date" value="${row.date}" data-date-kind="${row.isPrediction ? "prediction" : "confirmed"}" ${disabled} aria-label="${row.isPrediction ? "预测日期" : "生理期日期"}" />
                <span class="gap">${gap}</span>
                ${actionButtons ? `<div class="row-actions">${actionButtons}</div>` : "<span></span>"}
              </div>
            `;
          })
          .join("");

        updateEditorInteractivity();
      }

      function setEditorError(message = "") {
        els.editorError.textContent = message;
      }

      function resetEditor() {
        draftDates = [];
        els.editPassword.value = "";
        setEditorError();
      }

      async function saveDates(nextDates, password) {
        if (appState !== APP_STATE.READY) return;

        let normalizedDates;
        try {
          normalizedDates = validateAndNormalizeDateList(nextDates);
        } catch (error) {
          setEditorError(`${error.message}。`);
          return;
        }

        if (!password) {
          setEditorError("请输入编辑密码。");
          els.editPassword.focus();
          return;
        }
        if (/[\r\n]/.test(password)) {
          setEditorError("编辑密码不能包含换行符。");
          els.editPassword.focus();
          return;
        }

        setEditorError();
        setAppState(APP_STATE.SAVING, { message: "正在保存到云端，页面暂时只读" });

        try {
          const response = await fetchApi("/api/period-dates", {
            method: "PUT",
            headers: {
              authorization: `Bearer ${password}`,
              "content-type": "application/json",
              accept: "application/json",
            },
            body: JSON.stringify({ dates: normalizedDates }),
          });
          const data = await readResponseJson(response);

          if (response.status === 401 || response.status === 403) {
            setAppState(APP_STATE.READY, { message: "已连接云端，修改尚未保存" });
            els.editPassword.value = "";
            setEditorError("编辑密码错误，请重新输入后再试。");
            els.editPassword.focus();
            return;
          }
          if (!response.ok) throw new HttpError(response.status, data.error || "云端保存失败");

          const savedDates = extractCloudDates(data);
          dates = savedDates;
          writeLocalCache(savedDates);
          els.editPassword.value = "";
          els.editor.close();
          setAppState(APP_STATE.READY, { message: "日期已保存到云端数据库" });
        } catch (error) {
          if (error instanceof HttpError && error.status < 500) {
            setAppState(APP_STATE.READY, {
              message: "云端保存失败，已保留原有日期",
              isError: true,
            });
            setEditorError(`${error.message}，本机缓存和当前倒计时均未修改。`);
            return;
          }

          els.editPassword.value = "";
          setAppState(APP_STATE.UNAVAILABLE, {
            message: "保存未成功，已保留原有日期（只读）",
            isError: true,
            showRetry: true,
          });
          setEditorError(
            error instanceof HttpError
              ? `${error.message}，本机缓存和当前倒计时均未修改。关闭窗口后可重试连接。`
              : "未能确认云端保存结果，本机缓存和当前倒计时均未修改。关闭窗口后可重试连接。",
          );
        }
      }

      els.openEditor.addEventListener("click", () => {
        if (appState !== APP_STATE.READY || !dates.length) return;
        draftDates = [...dates];
        els.editPassword.value = "";
        setEditorError();
        renderEditor();
        els.editor.showModal();
        els.editPassword.focus();
      });

      els.closeEditor.addEventListener("click", () => els.editor.close());
      els.cancelEdit.addEventListener("click", () => els.editor.close());
      els.editor.addEventListener("close", resetEditor);

      els.addDate.addEventListener("click", () => {
        if (appState !== APP_STATE.READY) return;
        const next = draftDates.length ? getPrediction(draftDates).next : getTodayIsoDate();
        draftDates = validateAndNormalizeDateList([...draftDates, next]);
        setEditorError();
        renderEditor();
      });

      els.dateList.addEventListener("input", (event) => {
        if (appState !== APP_STATE.READY || !event.target.matches("input[data-date-kind='confirmed']")) return;

        const values = [...els.dateList.querySelectorAll("input[data-date-kind='confirmed']")].map(
          (input) => input.value,
        );
        try {
          draftDates = validateAndNormalizeDateList(values, { allowEmpty: true });
          setEditorError();
          renderEditor();
        } catch {
          setEditorError("请选择有效的日期。");
        }
      });

      els.dateList.addEventListener("click", (event) => {
        if (appState !== APP_STATE.READY) return;

        const recordTodayButton = event.target.closest("[data-record-today]");
        if (recordTodayButton) {
          const todayValue = getTodayIsoDate();
          const nextDates = validateAndNormalizeDateList([...draftDates, todayValue]);
          if (nextDates.length === draftDates.length) {
            setEditorError("今天已经记录过了。");
            return;
          }

          draftDates = nextDates;
          setEditorError();
          renderEditor();
          return;
        }

        const removeButton = event.target.closest("[data-remove]");
        if (!removeButton) return;
        draftDates.splice(Number(removeButton.dataset.remove), 1);
        draftDates = validateAndNormalizeDateList(draftDates, { allowEmpty: true });
        setEditorError();
        renderEditor();
      });

      els.editorForm.addEventListener("submit", (event) => {
        event.preventDefault();
        if (appState !== APP_STATE.READY) return;

        const values = [...els.dateList.querySelectorAll("input[data-date-kind='confirmed']")].map(
          (input) => input.value,
        );
        saveDates(values, els.editPassword.value);
      });

      els.retryConnection.addEventListener("click", () => {
        if (appState !== APP_STATE.UNAVAILABLE) return;
        connectToCloud();
      });

      window.addEventListener("online", () => {
        if (appState === APP_STATE.UNAVAILABLE) connectToCloud();
      });

      window.addEventListener("offline", () => {
        if (appState !== APP_STATE.READY) return;
        els.editPassword.value = "";
        setAppState(APP_STATE.UNAVAILABLE, {
          message: getUnavailableMessage(),
          showRetry: true,
        });
      });

      function initialize() {
        const cache = readLocalCache();
        if (cache) dates = cache.dates;

        // Render synchronously before the first network await so cached data is visible immediately.
        renderCountdown();
        setAppState(APP_STATE.CHECKING, { message: getCheckingMessage(cache) });
        void connectToCloud({ cache });
      }

      initialize();
    </script>
  </body>
</html>
