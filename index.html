<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>生理期倒计时</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7eef2;
        --panel: rgba(255, 255, 255, 0.78);
        --panel-strong: #ffffff;
        --text: #32252b;
        --muted: #7b6871;
        --primary: #c83f6b;
        --primary-strong: #a92f57;
        --ring: rgba(200, 63, 107, 0.24);
        --border: rgba(83, 55, 66, 0.14);
        --shadow: 0 24px 80px rgba(136, 56, 88, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
          sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(244, 173, 194, 0.5), transparent 32rem),
          linear-gradient(135deg, #fff7f9 0%, var(--bg) 52%, #f1f6ff 100%);
      }

      button,
      input {
        font: inherit;
      }

      .app {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 18px;
      }

      .card {
        width: min(760px, 100%);
        min-height: min(640px, calc(100vh - 64px));
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 28px;
        padding: clamp(24px, 5vw, 48px);
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--panel);
        box-shadow: var(--shadow);
        backdrop-filter: blur(20px);
      }

      .topline {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        text-align: center;
        color: var(--muted);
        font-size: clamp(16px, 2.5vw, 22px);
        line-height: 1.55;
      }

      .next-date {
        color: var(--text);
        font-weight: 800;
      }

      .edit-button {
        border: 1px solid rgba(200, 63, 107, 0.3);
        border-radius: 999px;
        padding: 8px 15px;
        color: var(--primary-strong);
        background: rgba(255, 255, 255, 0.78);
        cursor: pointer;
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          background 160ms ease;
      }

      .edit-button:hover {
        transform: translateY(-1px);
        border-color: var(--primary);
        background: #fff;
      }

      .countdown {
        display: grid;
        place-items: center;
        text-align: center;
      }

      .countdown-label {
        margin: 0;
        color: var(--muted);
        font-size: clamp(22px, 4vw, 34px);
        letter-spacing: 0;
      }

      .days {
        display: inline-block;
        min-width: 1.5em;
        color: var(--primary);
        font-size: clamp(86px, 20vw, 188px);
        font-weight: 900;
        line-height: 0.96;
        letter-spacing: 0;
        text-shadow: 0 18px 42px rgba(200, 63, 107, 0.24);
      }

      .subcopy {
        margin: 18px 0 0;
        color: var(--muted);
        font-size: clamp(15px, 2vw, 18px);
      }

      .timeline {
        display: grid;
        gap: 10px;
      }

      .timeline-title {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        font-weight: 700;
      }

      .chips {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .chip {
        flex: 0 0 auto;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 9px 13px;
        background: rgba(255, 255, 255, 0.64);
        color: var(--text);
        font-size: 14px;
      }

      .status {
        min-height: 22px;
        color: var(--muted);
        font-size: 14px;
        text-align: center;
      }

      dialog {
        width: min(620px, calc(100vw - 32px));
        border: 0;
        border-radius: 24px;
        padding: 0;
        color: var(--text);
        background: var(--panel-strong);
        box-shadow: 0 30px 90px rgba(50, 37, 43, 0.28);
      }

      dialog::backdrop {
        background: rgba(44, 32, 38, 0.34);
        backdrop-filter: blur(6px);
      }

      .modal {
        display: grid;
        gap: 20px;
        padding: 24px;
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: start;
      }

      .modal-title {
        margin: 0;
        font-size: 22px;
      }

      .modal-note {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .icon-button {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 50%;
        color: var(--muted);
        background: #fff;
        cursor: pointer;
      }

      .date-list {
        display: grid;
        gap: 12px;
        max-height: min(48vh, 420px);
        overflow: auto;
        padding-right: 4px;
      }

      .date-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 10px;
        align-items: center;
      }

      .date-row input {
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px 13px;
        color: var(--text);
        background: #fff;
        outline: none;
      }

      .date-row input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px var(--ring);
      }

      .gap {
        min-width: 112px;
        color: var(--muted);
        font-size: 14px;
        text-align: right;
      }

      .remove {
        border: 0;
        border-radius: 12px;
        padding: 10px 12px;
        color: #8b2d46;
        background: #fff1f5;
        cursor: pointer;
      }

      .modal-actions {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .left-actions,
      .right-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .button {
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 11px 16px;
        color: var(--text);
        background: #fff;
        cursor: pointer;
      }

      .button.primary {
        border-color: var(--primary);
        color: #fff;
        background: var(--primary);
      }

      .button.primary:hover {
        background: var(--primary-strong);
      }

      .button:disabled {
        opacity: 0.55;
        cursor: wait;
      }

      .error {
        color: #ba254d;
      }

      @media (max-width: 560px) {
        .card {
          border-radius: 22px;
        }

        .date-row {
          grid-template-columns: 1fr auto;
        }

        .gap {
          grid-column: 1 / -1;
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="card" aria-label="生理期倒计时">
        <header class="topline">
          <span>下一次生理期预计为 <span class="next-date" id="nextDate">加载中</span></span>
          <button class="edit-button" id="openEditor" type="button">编辑</button>
        </header>

        <section class="countdown" aria-live="polite">
          <div>
            <p class="countdown-label">倒计时 <span class="days" id="daysLeft">--</span> 天</p>
            <p class="subcopy" id="predictionText">正在读取云端日期记录</p>
          </div>
        </section>

        <footer class="timeline">
          <p class="timeline-title">近期记录</p>
          <div class="chips" id="timeline"></div>
          <div class="status" id="status"></div>
        </footer>
      </section>
    </main>

    <dialog id="editor">
      <form class="modal" id="editorForm" method="dialog">
        <div class="modal-header">
          <div>
            <h2 class="modal-title">校准生理期日期</h2>
            <p class="modal-note">已发生日期显示“间隔”，预测日期显示“预计间隔”。保存后会同步到 D1 数据库。</p>
          </div>
          <button class="icon-button" id="closeEditor" type="button" aria-label="关闭">×</button>
        </div>

        <div class="date-list" id="dateList"></div>

        <div class="modal-actions">
          <div class="left-actions">
            <button class="button" id="addDate" type="button">添加日期</button>
          </div>
          <div class="right-actions">
            <button class="button" id="cancelEdit" type="button">取消</button>
            <button class="button primary" id="saveDates" type="submit">保存</button>
          </div>
        </div>
      </form>
    </dialog>

    <script>
      const API_BASE_URL =
        window.location.protocol === "file:" ? "https://sien-day.cai975301994.workers.dev" : "";
      const fallbackDates = ["2026-03-28", "2026-04-25", "2026-05-23", "2026-06-18"];
      let dates = [...fallbackDates];
      let draftDates = [];

      const els = {
        nextDate: document.querySelector("#nextDate"),
        daysLeft: document.querySelector("#daysLeft"),
        predictionText: document.querySelector("#predictionText"),
        timeline: document.querySelector("#timeline"),
        status: document.querySelector("#status"),
        editor: document.querySelector("#editor"),
        openEditor: document.querySelector("#openEditor"),
        closeEditor: document.querySelector("#closeEditor"),
        cancelEdit: document.querySelector("#cancelEdit"),
        dateList: document.querySelector("#dateList"),
        addDate: document.querySelector("#addDate"),
        editorForm: document.querySelector("#editorForm"),
        saveDates: document.querySelector("#saveDates"),
      };

      function parseDate(value) {
        const [year, month, day] = value.split("-").map(Number);
        return new Date(year, month - 1, day);
      }

      function toIsoDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function formatChineseDate(value) {
        const date = parseDate(value);
        return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
      }

      function daysBetween(from, to) {
        const msPerDay = 24 * 60 * 60 * 1000;
        const start = Date.UTC(from.getFullYear(), from.getMonth(), from.getDate());
        const end = Date.UTC(to.getFullYear(), to.getMonth(), to.getDate());
        return Math.round((end - start) / msPerDay);
      }

      function addDays(value, days) {
        const date = parseDate(value);
        date.setDate(date.getDate() + days);
        return toIsoDate(date);
      }

      function getPrediction(sourceDates) {
        const sorted = [...sourceDates].sort();
        const last = sorted[sorted.length - 1];
        const previous = sorted[sorted.length - 2];
        const interval = previous ? daysBetween(parseDate(previous), parseDate(last)) : 28;
        const next = addDays(last, interval);
        const today = new Date();
        const todayOnly = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        const remaining = daysBetween(todayOnly, parseDate(next));

        return { next, interval, remaining };
      }

      function normalizeDateList(values) {
        return [...new Set(values)]
          .filter(Boolean)
          .filter((value) => /^\d{4}-\d{2}-\d{2}$/.test(value))
          .sort();
      }

      function render() {
        const prediction = getPrediction(dates);
        els.nextDate.textContent = formatChineseDate(prediction.next);
        els.daysLeft.textContent = prediction.remaining;
        els.predictionText.textContent =
          prediction.remaining >= 0
            ? `按最近一次间隔 ${prediction.interval} 天预测`
            : `预测日期已过去 ${Math.abs(prediction.remaining)} 天，请点击编辑校准`;

        const shown = [...dates.slice(-4), prediction.next];
        els.timeline.innerHTML = shown
          .map((date, index) => {
            const previous = shown[index - 1];
            const isFuture = index === shown.length - 1;
            const interval = previous ? daysBetween(parseDate(previous), parseDate(date)) : null;
            const suffix = interval == null ? "" : ` · ${isFuture ? "预计间隔" : "间隔"}${interval}天`;
            return `<span class="chip">${formatChineseDate(date)}${suffix}</span>`;
          })
          .join("");
      }

      function renderEditor() {
        const withPrediction = [...draftDates];
        if (withPrediction.length) {
          withPrediction.push(getPrediction(withPrediction).next);
        }

        els.dateList.innerHTML = withPrediction
          .map((date, index) => {
            const isPrediction = index === withPrediction.length - 1;
            const previous = withPrediction[index - 1];
            const gap = previous
              ? `${isPrediction ? "预计间隔" : "间隔"}${daysBetween(parseDate(previous), parseDate(date))}天`
              : "";
            return `
              <div class="date-row" data-index="${index}">
                <input type="date" value="${date}" ${isPrediction ? "disabled" : ""} aria-label="${isPrediction ? "预测日期" : "生理期日期"}" />
                <span class="gap">${gap}</span>
                ${
                  isPrediction
                    ? "<span></span>"
                    : `<button class="remove" type="button" data-remove="${index}" aria-label="删除 ${formatChineseDate(date)}">删除</button>`
                }
              </div>
            `;
          })
          .join("");
      }

      async function loadDates() {
        try {
          const response = await fetch(`${API_BASE_URL}/api/period-dates`, {
            headers: { accept: "application/json" },
          });
          if (!response.ok) throw new Error("云端读取失败");
          const data = await response.json();
          dates = normalizeDateList((data.dates || []).map((item) => item.date));
          if (!dates.length) dates = [...fallbackDates];
          els.status.textContent = "已连接云端数据库";
        } catch (error) {
          dates = [...fallbackDates];
          els.status.innerHTML = '<span class="error">暂时无法连接云端，已使用本地初始日期显示。</span>';
        }

        render();
      }

      async function saveDates(nextDates) {
        els.saveDates.disabled = true;
        els.saveDates.textContent = "保存中";

        try {
          const response = await fetch(`${API_BASE_URL}/api/period-dates`, {
            method: "PUT",
            headers: { "content-type": "application/json", accept: "application/json" },
            body: JSON.stringify({ dates: nextDates }),
          });

          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || "保存失败");

          dates = normalizeDateList((data.dates || []).map((item) => item.date));
          render();
          els.editor.close();
          els.status.textContent = "日期已保存到云端数据库";
        } catch (error) {
          els.status.innerHTML = `<span class="error">${error.message}</span>`;
        } finally {
          els.saveDates.disabled = false;
          els.saveDates.textContent = "保存";
        }
      }

      els.openEditor.addEventListener("click", () => {
        draftDates = [...dates];
        renderEditor();
        els.editor.showModal();
      });

      els.closeEditor.addEventListener("click", () => els.editor.close());
      els.cancelEdit.addEventListener("click", () => els.editor.close());

      els.addDate.addEventListener("click", () => {
        const base = draftDates.length ? draftDates[draftDates.length - 1] : toIsoDate(new Date());
        draftDates = normalizeDateList([...draftDates, addDays(base, 28)]);
        renderEditor();
      });

      els.dateList.addEventListener("input", (event) => {
        if (event.target.matches("input[type='date']:not(:disabled)")) {
          const rows = [...els.dateList.querySelectorAll(".date-row")].slice(0, draftDates.length);
          draftDates = normalizeDateList(rows.map((row) => row.querySelector("input").value));
          renderEditor();
        }
      });

      els.dateList.addEventListener("click", (event) => {
        const removeIndex = event.target.dataset.remove;
        if (removeIndex !== undefined) {
          draftDates.splice(Number(removeIndex), 1);
          draftDates = normalizeDateList(draftDates);
          renderEditor();
        }
      });

      els.editorForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const nextDates = normalizeDateList(
          [...els.dateList.querySelectorAll("input[type='date']:not(:disabled)")].map((input) => input.value),
        );

        if (!nextDates.length) {
          els.status.innerHTML = '<span class="error">请至少保留一个日期。</span>';
          return;
        }

        saveDates(nextDates);
      });

      loadDates();
    </script>
  </body>
</html>
